[package]
name = "saftsearch-core"
edition.workspace = true
license.workspace = true
version.workspace = true

[lib]
name = "saftsearch_core"
path = "src/lib.rs"

[[bin]]
name = "saftsearch-indexer"
path = "src/main.rs"

[dependencies]
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
walkdir = "2"
