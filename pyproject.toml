[project]
name = "saftsearch-app"
version = "0.1.0"
description = "Desktop UI shell for SaFtsearch."
requires-python = ">=3.11"
dependencies = [
  "pydantic>=2.0",
]

[project.optional-dependencies]
desktop = [
  "PySide6>=6.7",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["python-app/src"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.pytest.ini_options]
pythonpath = ["python-app/src"]
