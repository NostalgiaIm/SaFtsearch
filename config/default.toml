[index]
# 扫描根目录：建议首次启动由 Python 桌面层写入用户选择的目录。
roots = ["."]
exclude_patterns = ["target", ".git", ".saftsearch", "node_modules", "__pycache__"]
follow_symlinks = false

[search]
# 默认结果数量，避免一次性向 UI 推送过多条目。
result_limit = 50
debounce_ms = 120

[storage]
# 第一版使用版本化 JSON 索引，后续可在保持 IndexStore 接口的前提下替换为数据库。
index_file = ".saftsearch/index.json"
